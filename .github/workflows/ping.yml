name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          BODY=$(curl --fail --max-time 30 https://mintbot-h0vg.onrender.com/healthz)
          echo "$BODY"
